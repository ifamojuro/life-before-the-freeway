name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # conftest.py points at a temp SQLite DB and forces LBTF_USE_CLAUDE=0,
      # so the suite needs no secrets or network.
      - run: python -m pytest -q

  frontend:
    name: frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Vitest (jsdom) unit/component tests — see frontend/src/test/setup.ts.
      - run: npm test
      # `tsc -b && vite build` — the README's gate for the frontend.
      - run: npm run build
